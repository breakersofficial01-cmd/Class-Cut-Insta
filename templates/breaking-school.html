<!doctype html>
<html><head><meta charset="utf-8">
<style>FONTS</style>
<style>
:root{--bg1:#0b0b0b;--bg2:#1a1a12;--yellow:#FFB21E;--green:#3DDC84;--white:#fff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent}
.frame{position:relative;width:1080px;height:1920px;font-family:'Hind Siliguri','Poppins','Noto Color Emoji',sans-serif;color:var(--white);
  background:radial-gradient(ellipse at 50% 0%,#2a2610 0%,transparent 55%),radial-gradient(ellipse at 50% 100%,#10261a 0%,transparent 50%),linear-gradient(180deg,var(--bg1),var(--bg2) 50%,var(--bg1));}
.slot{position:absolute;left:0;top:VIDEO_Y;width:1080px;height:608px;background:transparent}
.frame{-webkit-mask:linear-gradient(#000,#000) top/100% VIDEO_Y no-repeat,linear-gradient(#000,#000) bottom/100% calc(1920px - VIDEO_Y - 608px) no-repeat}
.bar{position:absolute;left:0;width:1080px;height:8px;background:var(--yellow)}
.top{position:absolute;top:268px;left:0;right:0;text-align:center}
.tag{display:inline-block;background:var(--yellow);color:#111;font-weight:700;font-size:40px;padding:10px 36px 4px;border-radius:60px;letter-spacing:.5px}
.headline{margin-top:30px;font-weight:700;font-size:96px;line-height:1.15}
.headline .en{font-family:'Poppins',sans-serif;font-weight:800;font-size:84px}
.headline .hl{color:var(--yellow);display:inline-block;border-bottom:8px solid var(--yellow);padding:0 6px;line-height:1.05}
.card{position:absolute;top:1290px;left:60px;right:60px;background:#fff;color:#111;border-radius:28px;padding:26px 36px 18px;font-weight:600;font-size:40px;line-height:1.45}
.card .t{color:#c98200;font-weight:700;font-size:46px;margin-bottom:6px}
.cta{position:absolute;top:CTA_Y;left:60px;right:60px;border:4px solid var(--yellow);border-radius:28px;background:rgba(255,210,31,.08);
  text-align:center;padding:30px 20px 22px;font-weight:700;font-size:54px;line-height:1.3}
.cta .hl{color:var(--yellow)}
.foot{position:absolute;top:FOOT_Y;left:70px;right:70px;text-align:center;font-weight:600;font-size:40px;line-height:1.45;color:#e8e8e8}
.foot .brand{font-family:'Poppins',sans-serif;font-weight:800;color:var(--yellow)}
.logo{position:absolute;top:80px;left:0;right:0;text-align:center}.logo svg{width:430px;height:auto}
</style></head><body>
<div class="frame">
  <div class="logo">LOGO</div>
  <div class="top">
    <div class="tag">TAG</div>
    <div class="headline">HEADLINE</div>
  </div>
  <div class="bar" style="top:calc(VIDEO_Y - 8px)"></div>
  <div class="bar" style="top:calc(VIDEO_Y + 608px)"></div>
  CARD
  <div class="cta">CTA</div>
  <div class="foot">FOOT</div>
</div>
</body></html>
